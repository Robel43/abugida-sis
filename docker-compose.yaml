services:

  db:
    image: mariadb:10.11
    container_name: abugida-db
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: abugida_root_dev
      MARIADB_DATABASE: abugida_sis
      MARIADB_USER: abugida_user
      MARIADB_PASSWORD: abugida_dev_password

    volumes:
      - abugida_db_data:/var/lib/mysql

    ports:
      - "3307:3306"


  web:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - path: .env.smtp
        required: false

    container_name: abugida-web
    restart: unless-stopped

    depends_on:
      - db

    ports:
      - "8090:80"

    volumes:
      - ./rosariosis:/var/www/html


  registration-migrations:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["php", "/opt/abugida/database/migrate-registration.php"]
    depends_on:
      - db
    volumes:
      - ./database:/opt/abugida/database:ro
      - ./rosariosis/config.inc.php:/opt/abugida/rosariosis/config.inc.php:ro

volumes:
  abugida_db_data: